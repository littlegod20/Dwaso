# Fly.io app configuration for the Dwaso API.
#
# Create the app once with `fly apps create dwaso-api`, then set secrets with
# `fly secrets set DATABASE_URL=... REDIS_URL=... JWT_SECRET=... CORS_ORIGINS=...`.
# Migrations run as a release command before the new machines take traffic, and
# must stay backward-compatible with the previous app version so a rollback does
# not strand the database on a schema the old image cannot read.

app = 'dwaso-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node dist/db/migrate.js'
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOST = '0.0.0.0'
  OTEL_ENABLED = 'false'
  OTEL_SERVICE_NAME = 'dwaso-api'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
